<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <p id="addition"></p>

    <script>
        function basic(p1, p2) {
            return p1 + p2;
        }
        
        const addition = document.getElementById('addition');
        const result = basic(2,4);
        addition.innerHTML = result;
    </script>

</body>
